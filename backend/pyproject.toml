[project]
name = "cue"
version = "0.1.0"
description = "영화/공연 실시간 예매 서비스"
authors = [
    { name = "honee8583", email = "ekgns0508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
