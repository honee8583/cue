# main 브랜치로 향하는 PR은 dev 브랜치에서 온 것만 통과시킨다.
# 저장소 ruleset "main: dev에서만 머지"가 이 검사(only-from-dev) 통과를 머지 조건으로 요구한다.
name: main-merge-guard

on:
  pull_request:
    branches: [main]

jobs:
  only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: dev 브랜치에서 온 PR인지 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "main으로는 dev 브랜치에서만 머지할 수 있습니다. (현재 브랜치: $HEAD_REF)"
            exit 1
          fi
          echo "dev → main PR 확인 완료"
